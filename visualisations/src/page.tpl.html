<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutsches Recht in 20 Grafiken</title>
<meta name="description" content="Zwanzig Grafiken zum deutschen Recht aus dem Repository germany-law / Twenty charts on German law from the germany-law repository">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">

<style>
:root {
  color-scheme: light;
  --bg: #f7f6f3; --surface: #fcfcfb; --surface-2: #f1f0ec; --line: #e4e2dc; --grid: #ebe9e4;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974; --accent: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --muted-mark: #b9b7b0;
  --seq-lo: #eef4fc; --seq-hi: #0d366b;
  --land: #e6e4de; --land-line: #fcfcfb;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: "Source Serif 4", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --muted-mark: #55544f;
    --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
    --land: #2c2c2a; --land-line: #1a1a19;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --muted-mark: #55544f;
  --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
  --land: #2c2c2a; --land-line: #1a1a19;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); }
a { color: var(--accent); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
header.top { padding: 28px 0 8px; }
.bar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.toggles { display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--text-2); font: 500 13px/1 var(--sans); padding: 7px 12px; border-radius: 999px; cursor: pointer; min-height: 30px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h1 { font: 600 clamp(28px, 5vw, 44px)/1.2 var(--serif); margin: 0 0 14px; letter-spacing: -.01em; }
.lede { font-size: 17px; color: var(--text-2); max-width: 780px; margin: 0 0 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 26px 0 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; }
.tile b { display: block; font: 600 24px/1.15 var(--sans); font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--text-2); line-height: 1.5; display: block; margin-top: 2px; }
details.profile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin: 10px 0 0; }
details.profile > summary, details.tbl > summary { cursor: pointer; padding: 12px 14px; font-weight: 500; font-size: 14px; list-style: none; }
details.profile > summary::-webkit-details-marker, details.tbl > summary::-webkit-details-marker { display: none; }
details.profile > summary::before, details.tbl > summary::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--text-3); transition: transform .15s; }
details[open].profile > summary::before, details[open].tbl > summary::before { transform: rotate(90deg); }
.scroll { overflow-x: auto; padding: 0 14px 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--text-2); font-size: 12px; }
td.n, th.n { text-align: right; white-space: nowrap; }
code { font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; word-break: break-all; }
nav.toc { margin: 30px 0 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 6px 22px; font-size: 13px; }
nav.toc a { color: var(--text-2); text-decoration: none; display: block; padding: 3px 0; }
nav.toc a:hover { color: var(--text); text-decoration: underline; }
nav.toc .p { font-weight: 600; color: var(--text); margin-top: 6px; }
section.part { padding-top: 34px; }
section.part > h2 { font: 600 26px/1.25 var(--serif); margin: 0 0 6px; }
section.part > p.pd { color: var(--text-2); margin: 0 0 6px; max-width: 780px; }
figure.chart { margin: 22px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 6px; }
figure.chart h3 { font: 600 19px/1.35 var(--serif); margin: 0 0 6px; }
figure.chart h3 .no { color: var(--text-3); font-weight: 500; margin-right: .35em; }
.dek { color: var(--text-2); margin: 0 0 12px; max-width: 840px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-2); margin: 0 0 8px; line-height: 1.5; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.dot { border-radius: 50%; }
.legend i.ring { background: transparent !important; border: 2px solid var(--text-3); border-radius: 50%; }
.legend i.line { height: 2px; width: 14px; border-radius: 1px; vertical-align: 3px; }
.legend i.dash { height: 0; width: 14px; border-radius: 0; border-top: 2px dashed; background: transparent !important; vertical-align: 3px; }
.legend i.hatch { background-image: repeating-linear-gradient(135deg, currentColor 0 2px, transparent 2px 5px) !important; background-color: var(--surface-2) !important; }
.legend i.outline { background: transparent !important; border: 2px solid; border-radius: 3px; }
.plot { width: 100%; position: relative; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text, .lbl { fill: var(--text-2); font: 11px var(--sans); font-variant-numeric: tabular-nums; }
.lbl.strong { fill: var(--text); font-weight: 500; }
.lbl.mut { fill: var(--text-3); }
.lbl.big { font-size: 12px; }
.axis path { display: none; }
.axis line, .grid line { stroke: var(--grid); }
.base { stroke: var(--text-3); stroke-width: 1; }
.note { font-size: 12px; color: var(--text-3); margin: 10px 0 4px; line-height: 1.6; }
.note b { color: var(--text-2); font-weight: 500; }
details.tbl { border-top: 1px solid var(--line); margin: 10px -18px 0; }
details.tbl > summary { font-size: 12px; color: var(--text-2); padding: 10px 18px; }
details.tbl .scroll { max-height: 360px; overflow: auto; padding: 0 18px 12px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.45; box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: 340px; opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:last-child { font-variant-numeric: tabular-nums; text-align: right; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.tip .q { margin-top: 4px; color: var(--text-2); }
.hit { fill: transparent; cursor: default; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.mini h4 { margin: 0 0 2px; font: 600 13px/1.4 var(--sans); }
.mini p { margin: 0 0 6px; font-size: 12px; color: var(--text-2); }
.multi { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px; }
.multi h4 { margin: 0; font: 600 13px/1.4 var(--sans); overflow-wrap: anywhere; min-height: 2.8em; display: flex; align-items: flex-end; }
.multi p { margin: 0 0 2px; font-size: 12px; color: var(--text-2); }
.ptiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 4px 0 14px; }
.ptile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.ptile .pn { font: 500 12px/1.4 var(--sans); color: var(--text-2); overflow-wrap: anywhere; }
.ptile .pv { font-size: 12px; color: var(--text-2); margin: 2px 0; }
.ptile .pv b { font: 600 22px/1.15 var(--sans); color: var(--text); font-variant-numeric: tabular-nums; margin-right: 2px; }
.ptile .ps { font-size: 12px; color: var(--text-3); line-height: 1.5; }
.ptile .pbar { display: flex; gap: 2px; height: 6px; margin-top: 8px; border-radius: 3px; overflow: hidden; }
.ptile .pbar i { display: block; }
.sub { margin: 18px 0 4px; font: 600 13px/1.4 var(--sans); }
.twocol { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.amlist { font-size: 12px; line-height: 1.45; }
.amlist .ar { display: grid; grid-template-columns: 40px max-content minmax(0, 1fr); gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.amlist .ar b { font-weight: 600; font-variant-numeric: tabular-nums; }
.amlist .ar span:nth-child(2) { color: var(--text); }
.amlist .ar span:last-child { color: var(--text-2); text-align: right; }
.amlist .ar i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
footer { color: var(--text-3); font-size: 12px; padding: 40px 0 60px; }
@media (max-width: 760px) { .twocol { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) {
  figure.chart { padding: 14px 12px 4px; border-radius: 12px; }
  details.tbl { margin: 10px -12px 0; }
  details.tbl > summary { padding: 10px 12px; }
  details.tbl .scroll { padding: 0 12px 12px; }
  .lede { font-size: 15px; }
  .multi { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
  .ptiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (forced-colors: active) { .seg button[aria-pressed="true"] { outline: 2px solid CanvasText; } }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin: 2px 0 14px; }
.card { background: var(--surface-2); border-radius: 10px; padding: 11px 13px; }
.card .cn { font: 600 24px/1.15 var(--sans); font-variant-numeric: tabular-nums; }
.card .ct { font-size: 12px; color: var(--text-2); line-height: 1.5; margin-top: 3px; }
.card .cl { font-size: 12px; color: var(--text-2); line-height: 1.45; margin: 6px 0 0; padding-left: 14px; }
.card .cl li { margin: 1px 0; }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="bar">
    <span class="toggles">
      <span class="seg" role="group" aria-label="Sprache / Language"><button data-lang="de">DE</button><button data-lang="en">EN</button></span>
      <span class="seg" role="group" aria-label="Darstellung / Theme"><button data-theme-set="auto">Auto</button><button data-theme-set="light">☀</button><button data-theme-set="dark">☾</button></span>
    </span>
  </div>
  <h1 data-i="title"></h1>
  <p class="lede" data-i="lede"></p>
  <p class="note" id="gl-link"></p>
  <div class="tiles" id="tiles"></div>
  <details class="profile"><summary data-i="profile_h"></summary><div class="scroll" id="profile"></div></details>
  <nav class="toc" id="toc"></nav>
</header>
<main id="main"></main>
<footer id="foot"></footer>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>
<script>
const DATA = /*DATA*/null;
</script>
<script>
"use strict";
const PF = DATA.profile;
let LANG = 'de';
try { const q = new URLSearchParams(location.search).get('lang'); if (q === 'en' || q === 'de') LANG = q; else { const s = localStorage.getItem('de-viz-lang'); if (s === 'en' || s === 'de') LANG = s; } } catch (e) {}
let THEME = 'auto';
try { const t = localStorage.getItem('de-viz-theme'); if (t === 'light' || t === 'dark') THEME = t; } catch (e) {}

const t = k => S[LANG][k];
const DE = () => LANG === 'de';
const L = (de, en) => DE() ? de : en;
const grp = (s, sep) => s.replace(/\B(?=(\d{3})+(?!\d))/g, sep);
const fmt = n => { if (n == null || isNaN(n)) return '–'; const v = Math.round(+n); return (v < 0 ? '−' : '') + grp(String(Math.abs(v)), DE() ? '.' : ','); };
const dec = (v, d = 1) => { const s = Math.abs(+v).toFixed(d), [i, f] = s.split('.'); return (+v < 0 ? '−' : '') + grp(i, DE() ? '.' : ',') + (f ? (DE() ? ',' : '.') + f : ''); };
const PS = () => DE() ? ' %' : '%';
const pct = (a, b, d = 0) => b ? dec(100 * a / b, d) + PS() : '–';
const pv = (v, d = 0) => dec(v, d) + PS();
const MON = { de: ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'], en: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'] };
const MSH = { de: ['Jan.', 'Feb.', 'März', 'Apr.', 'Mai', 'Juni', 'Juli', 'Aug.', 'Sept.', 'Okt.', 'Nov.', 'Dez.'], en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] };
const dateTxt = s => { if (!s) return '–'; const [y, m, d] = s.split('-').map(Number); return DE() ? `${d}. ${MON.de[m - 1]} ${y}` : `${d} ${MON.en[m - 1]} ${y}`; };
const dateShort = s => { if (!s) return '–'; const [y, m, d] = s.split('-').map(Number); return DE() ? `${d}. ${MSH.de[m - 1]} ${y}` : `${d} ${MSH.en[m - 1]} ${y}`; };
const dayMonth = (m, d) => DE() ? `${d}. ${MON.de[m - 1]}` : `${d} ${MON.en[m - 1]}`;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const S8 = () => [1, 2, 3, 4, 5, 6, 7, 8].map(i => css('--s' + i));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = (a, f) => a.reduce((s, d) => s + (f ? f(d) : d), 0);
const ord = n => DE() ? `${n}.` : n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
const WPY = w => DATA.wpyears[w];
const WPL = w => L(`${w}. Wahlperiode (${WPY(w)[0]}–${w === WPMAX ? 'heute' : WPY(w)[1]})`, `${ord(w)} Wahlperiode (${WPY(w)[0]}–${w === WPMAX ? 'today' : WPY(w)[1]})`);
const WPMAX = PF.wp_to, YEAR_LAST = +PF.built.slice(0, 4);

// ------------------------------------------------------------------ strings
const S = {
de: {
  title: 'Deutsches Recht in 20 Grafiken',
  lede: 'Zwanzig Grafiken, allein aus den Daten dieses Repositorys: jedes Gesetzgebungsverfahren des Bundestages seit 1972 mit Einbringung, Beratung, Vermittlungsausschuss und Verkündung; die namentlichen Abstimmungen seit 2019; das Verzeichnis aller Rechtsvorschriften des Bundes und ihre Änderungen seit Juni 2019; die Entscheidungen der Senate des Bundesverfassungsgerichts; das Gemeindeverzeichnis; und fünf deutsche Verfassungen von 1849 bis heute.',
  profile_h: 'Datenprofil: was verwendet wurde und wie vollständig es ist',
  tbl: 'Datentabelle', src: 'Quelle im Repository', n: 'Datensätze', cover: 'Abdeckung', caveat: 'Grenzen', ds: 'Datensatz',
  foot: 'Erstellt aus dem Repository lexifina/germany-law (Stand {built}, Commit {head}). Alle Zahlen berechnet visualisations/src/prep.py aus den Git-Objekten des Repositorys; build.py setzt die Seite zusammen. Die Grafiken beschreiben, was die Quellen verzeichnen, nicht warum.',
  year: 'Jahr', total: 'Insgesamt', share: 'Anteil', partial: 'unvollständig', count: 'Anzahl', wp: 'Wahlperiode',
  gl: 'Grafiken zum Recht aller Länder, aus ganz global-law: <a href="https://github.com/lexifina/global-law/tree/main/visualisations">global-law visualisations/</a>. Hier stehen nur die Grafiken zu Deutschland.',
},
en: {
  title: 'German law in 20 charts',
  lede: 'Twenty charts drawn only from the data in this repository: every legislative procedure of the Bundestag since 1972, with its introduction, readings, mediation committee and promulgation; the roll-call votes since 2019; the index of all federal acts and their changes since June 2019; the decisions of the Senates of the Federal Constitutional Court; the register of municipalities; and five German constitutions from 1849 to today.',
  profile_h: 'Data profile: what was used and how complete it is',
  tbl: 'Data table', src: 'Source in the repository', n: 'Records', cover: 'Coverage', caveat: 'Limit', ds: 'Dataset',
  foot: 'Built from the lexifina/germany-law repository (as of {built}, commit {head}). All numbers are computed by visualisations/src/prep.py from the repository\'s git objects; build.py assembles the page. The charts describe what the sources record, not why.',
  year: 'Year', total: 'Total', share: 'Share', partial: 'incomplete', count: 'Count', wp: 'Wahlperiode (term)',
  gl: 'Charts on every country\'s law, from the whole of global-law: <a href="https://github.com/lexifina/global-law/tree/main/visualisations">global-law visualisations/</a>. These are the charts on Germany alone.',
}};

// ------------------------------------------------------------------ tooltip
const tip = document.getElementById('tip');
function showTip(ev, html) { tip.innerHTML = html; tip.style.opacity = 1; moveTip(ev); }
function moveTip(ev) {
  const r = tip.getBoundingClientRect(), pad = 14;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tip.style.opacity = 0; }
function bindTip(sel, fn) {
  sel.on('mouseenter', (ev, d) => showTip(ev, fn(d))).on('mousemove', moveTip).on('mouseleave', hideTip)
     .on('touchstart', (ev, d) => { const tt = ev.touches[0]; showTip({ clientX: tt.clientX, clientY: tt.clientY }, fn(d)); }, { passive: true });
}
const trow = (sw, k, v) => `<div class="r"><span>${sw ? `<i class="sw" style="background:${sw}"></i>` : ''}${esc(k)}</span><span>${v}</span></div>`;
const tq = s => `<div class="q">${esc(s)}</div>`;

// ------------------------------------------------------------------ chart scaffolding (as on the other country pages)
function legend(el, items) {
  const lg = el.append('div').attr('class', 'legend');
  items.forEach(it => { const s = lg.append('span'); s.append('i').attr('class', it.shape || '').style('background', it.c).style('border-color', it.c).style('color', it.c); s.append('span').text(it.l); });
  return lg;
}
function svgIn(el, w, h) { return el.append('div').attr('class', 'plot').append('svg').attr('viewBox', `0 0 ${w} ${h}`).attr('width', w).attr('height', h).attr('role', 'img'); }
function table(el, head, rows) {
  const d = el.append('details').attr('class', 'tbl');
  d.append('summary').text(t('tbl'));
  const tb = d.append('div').attr('class', 'scroll').append('table');
  tb.append('thead').append('tr').selectAll('th').data(head).join('th').attr('class', (h, i) => i ? 'n' : null).text(h => h);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').attr('class', (v, i) => i ? 'n' : null).text(v => typeof v === 'number' ? fmt(v) : v);
  return d;
}
function note(el, src, n, extra) {
  const p = el.append('p').attr('class', 'note');
  p.html(`<b>${t('src')}:</b> ${src.map(s => `<code>${esc(s)}</code>`).join(' ')} · <b>${t('n')}:</b> ${n}${extra ? ' · ' + esc(extra) : ''}`);
}
function yAxis(g, y, w, ticks = 5, f = fmt) {
  const ax = g.append('g').attr('class', 'axis grid');
  y.ticks(ticks).forEach(v => {
    ax.append('line').attr('x1', 0).attr('x2', w).attr('y1', y(v)).attr('y2', y(v));
    ax.append('text').attr('x', -6).attr('y', y(v)).attr('dy', '0.32em').attr('text-anchor', 'end').text(f(v));
  });

      const x = d3.scalePoint().domain(rows.map(r => r.wp)).range([0, iw]).padding(0.3), y = d3.scaleLinear().domain([0, d3.max(rows, r => r.q3)]).nice().range([ih, 0]);
      yAxis(g, y, iw, 5);

// 3. the parliamentary year
chart('c03', el => {
  const c = DATA.c03, ym = c.ym, y0 = +c.first.slice(0, 4), y1 = +c.last.slice(0, 4), months = d3.range(1, 13), years = d3.range(y0, y1 + 1);
  const byM = months.map(mo => sum(Object.entries(ym).filter(([k]) => +k.slice(5) === mo), e => e[1]));
  const jun = byM[5], aug = byM[7], dec_ = byM[11], nov = byM[10];
  return {
    title: L(`Das Parlamentsjahr: ${pct(jun, c.n)} aller Gesetzesbeschlüsse fallen in den Juni, ${fmt(aug)} in einen August`,
      `The parliamentary year: ${pct(jun, c.n)} of all final votes on laws fall in June, ${fmt(aug)} in an August`),
    toc: L('Das Parlamentsjahr', 'The parliamentary year'),
    dek: L(`Jede Zelle ist ein Monat: wie viele später verkündete Gesetze der Bundestag in ihm endgültig beschloss. Vor der Sommerpause im Juni (${fmt(jun)}) und im November (${fmt(nov)}) wird am meisten beschlossen, im August so gut wie nichts. In Wahljahren fehlen die Monate um die Bundestagswahl.`,
      `Each cell is a month: how many laws, later promulgated, the Bundestag finally passed in it. Most are passed in June (${fmt(jun)}), before the summer break, and in November (${fmt(nov)}); in August almost nothing. In election years the months around the federal election are empty.`),
    draw(el) {
      const w = W(el), nw = narrow(w), ramp = seqRamp(), mx = d3.max(Object.values(ym));
      const cl = v => v ? ramp(0.12 + 0.88 * Math.sqrt(v / mx)) : css('--surface-2');
      const lw = 34, rw = nw ? 30 : 64, cw = (w - lw - rw) / 12, ch = nw ? 9 : 11;
      const svg = svgIn(el, w, 20 + years.length * ch + 22), g = svg.append('g').attr('transform', `translate(${lw},18)`);
      months.forEach(mo => g.append('text').attr('class', 'lbl').attr('x', (mo - 1) * cw + cw / 2).attr('y', -6).attr('text-anchor', 'middle').text(nw ? MSH[LANG][mo - 1].slice(0, 1) : MSH[LANG][mo - 1]));
      const yt = years.map(y => sum(months, mo => ym[`${y}-${String(mo).padStart(2, '0')}`] || 0)), mt = d3.max(yt);
      years.forEach((y, i) => {
        if (y % 5 === 0 || i === 0) g.append('text').attr('class', 'lbl').attr('x', -6).attr('y', i * ch + ch / 2 + 4).attr('text-anchor', 'end').text(y);
        months.forEach(mo => {
          const k = `${y}-${String(mo).padStart(2, '0')}`, v = ym[k] || 0;
          bindTip(g.append('rect').attr('x', (mo - 1) * cw + .7).attr('y', i * ch + .7).attr('width', cw - 1.4).attr('height', ch - 1.4).attr('rx', 2).attr('fill', cl(v)).attr('opacity', (y === y0 && mo < 12) ? .35 : 1).datum([y, mo, v]),
            q => `<b>${MON[LANG][q[1] - 1]} ${q[0]}</b>` + trow(null, L('Gesetzesbeschlüsse', 'final votes on laws'), fmt(q[2])));
        });
        const bx = 12 * cw + 6, bl = (rw - (nw ? 4 : 30)) * yt[i] / mt;
        g.append('rect').attr('x', bx).attr('y', i * ch + 1.5).attr('width', Math.max(0, bl)).attr('height', ch - 3).attr('rx', 1.5).attr('fill', css('--muted-mark')).attr('opacity', y === y1 ? .5 : 1);
      });
      if (!nw) g.append('text').attr('class', 'lbl mut').attr('x', 12 * cw + 6).attr('y', -6).text(L('Jahr', 'year'));
      g.append('text').attr('class', 'lbl mut').attr('x', 0).attr('y', years.length * ch + 16).text(L(`dunkler = mehr Beschlüsse; rechts: je Jahr (höchstens ${fmt(mt)})`, `darker = more votes; right: per year (at most ${fmt(mt)})`));
      note(el, ['bundestag/vorgaenge/wpNN/<Vorgang>.md (Verlauf: 3. Beratung)'], fmt(c.n) + L(' verkündete Gesetze', ' promulgated laws'),
        L(`der Tag der 3. Beratung (oder der 2. Beratung mit Schlussabstimmung) im Bundestag. ${y0} beginnt mit der 7. Wahlperiode im Dezember; ${y1} ist unvollständig (heller).`, `the day of the third reading (or the second reading with final vote) in the Bundestag. ${y0} starts with the 7th term in December; ${y1} is incomplete (lighter).`));
      table(el, [t('year'), ...MSH[LANG], t('total')], years.map((y, i) => [String(y), ...months.map(mo => ym[`${y}-${String(mo).padStart(2, '0')}`] || 0), yt[i]]));
    }

// 4. how bills end
const OUTK = ['law', 'rej', 'done', 'lapsed', 'other'];

  const rows = DATA.c04.rows, g = (k, s) => rows.find(r => r.g === k && r.span === s) || {}, tot = r => sum(OUTK, k => r[k] || 0);
  const b20 = g('breg', '20'), b16 = g('breg', '16-19'), o16 = g('opp', '16-19');
  return {
    title: L(`Wie Entwürfe enden: ${pct(b20.lapsed || 0, tot(b20))} der Regierungsentwürfe der 20. Wahlperiode verfielen, ${pct(b16.lapsed || 0, tot(b16), 1)} in der 16. bis 19.`,

    draw(el) {

        L(`der Beratungsstand von DIP. „Erledigt durch Ablauf der Wahlperiode“ verzeichnet DIP erst ab der 16. Wahlperiode durchgehend (dazu in der 7.: ${fmt(DATA.c04.status_wp[7])}), daher nur 16 bis 20. „Abgelehnt“ umfasst die abgelehnte Einbringung im Bundesrat und die versagte Zustimmung.`,
          `DIP's status. DIP records "lapsed at the end of the term" consistently only from the 16th term (and in the 7th: ${fmt(DATA.c04.status_wp[7])}), hence 16 to 20 only. "Rejected" includes a Bundesrat vote not to bring a bill in and a refused consent.`));

// 5. roll-call votes
const FAC = { 'CDU/CSU': ['CDU/CSU', '#2d3c4b'], 'SPD': ['SPD', '#e3000f'], 'AfD': ['AfD', '#009ee0'], 'Grüne': ['Grüne', '#1aa037'], 'FDP': ['FDP', '#e5c100'], 'Die Linke': ['Die Linke', '#be3075'], 'BSW': ['BSW', '#7d254f'] };
chart('c05', el => {
  const c = DATA.c05, ws = Object.keys(c).map(Number).sort(), last = c[ws[ws.length - 1]], ag = (cc, a, b) => cc.m[`${a}|${b}`] || cc.m[`${b}|${a}`];
  const cs = ag(last, 'CDU/CSU', 'SPD') || [0, 0], w20 = c[20], gf = ag(w20, 'Grüne', 'FDP') || [0, 0];
  return {
    title: L(`Namentliche Abstimmungen: CDU/CSU und SPD stimmten in ${fmt(cs[0])} von ${fmt(cs[1])} Abstimmungen der 21. Wahlperiode gleich`,

    toc: L('Namentliche Abstimmungen', 'Roll-call votes'),
    dek: L(`Für jedes Paar von Fraktionen und Gruppen: in wie viel Prozent der namentlichen Abstimmungen beide mehrheitlich gleich stimmten (ja, nein oder Enthaltung). In der 20. Wahlperiode stimmten Grüne und FDP in ${pct(gf[0], gf[1])} der Fälle gleich. Die Koalitionen stimmen geschlossen; die Opposition stimmt untereinander selten gleich.`,
      `For every pair of parliamentary groups: in what share of the roll-call votes the majorities of both voted the same way (yes, no or abstain). In the 20th term the Greens and the FDP voted alike in ${pct(gf[0], gf[1])} of them. Coalitions vote as one; opposition groups rarely vote with each other.`),
    draw(el) {
      const box = el.append('div').attr('class', 'mini'), ramp = seqRamp();
      const cells = ws.map(w => { const cc = c[w], cell = box.append('div'); cell.append('h4').text(WPL(w));
        cell.append('p').text(L(`${fmt(cc.n)} Abstimmungen, ${dateShort(cc.from)} bis ${dateShort(cc.to)}`, `${fmt(cc.n)} votes, ${dateShort(cc.from)} to ${dateShort(cc.to)}`)); return cell; });
      ws.forEach((w, wi) => {
        const cc = c[w], facs = cc.facs.slice().sort((a, b) => (cc.seats[b] || 0) - (cc.seats[a] || 0)), cell = cells[wi];
        const w0 = W(cell), lw = textW(cell, facs.map(f => FAC[f] ? FAC[f][0] : f)) + 12, n = facs.length, cw = Math.min(46, (w0 - lw - 4) / (n - 1)), h = 18 + (n - 1) * cw + 4;
        const svg = svgIn(cell, w0, h), g = svg.append('g').attr('transform', `translate(${lw},16)`);
        facs.slice(0, -1).forEach((f, j) => g.append('text').attr('class', 'lbl').attr('x', j * cw + cw / 2).attr('y', -5).attr('text-anchor', 'middle').style('font-size', '10px').text(FAC[f] ? FAC[f][0].replace('Die Linke', 'Linke') : f));
        facs.slice(1).forEach((a, i) => {
          g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', i * cw + cw / 2 + 4).attr('text-anchor', 'end').text(FAC[a] ? FAC[a][0] : a);

              q => `<b>${esc(q[0])} · ${esc(q[1])}</b>` + trow(null, L('gleich gestimmt', 'voted alike'), `${fmt(q[2][0])} / ${fmt(q[2][1])} · ${pct(q[2][0], q[2][1])}`));
            if (cw >= 26) g.append('text').attr('class', 'lbl').attr('x', j * cw + cw / 2).attr('y', i * cw + cw / 2 + 4).attr('text-anchor', 'middle').style('fill', inkOn(fill)).style('pointer-events', 'none').text(dec(100 * s, 0));
          });
        });
      });
      note(el, ['bundestag/abstimmungen/<Jahr>/<Datum>-<Nr>.md'], fmt(sum(ws, w => c[w].n)) + L(' namentliche Abstimmungen', ' roll-call votes'),
        L('die Position einer Fraktion ist die Antwort der meisten ihrer Abgeordneten; bei Gleichstand zählt die Abstimmung für sie nicht. Fraktionslose sind nicht gezählt. Die Linke war bis Dezember 2023 Fraktion, danach Gruppe (zusammengefasst); das BSW ist eine Gruppe ab 2024. Die Daten beginnen im September 2019; die 21. Wahlperiode läuft noch.',
          'a group\'s position is the answer of most of its members; a tie leaves that vote out for the group. Members outside groups are not counted. Die Linke was a parliamentary group until December 2023 and then a smaller group (counted together); the BSW is a group from 2024. The data start in September 2019; the 21st term is still running.'));
      const rows = [];
      ws.forEach(w => { const cc = c[w]; Object.entries(cc.m).forEach(([k, v]) => { if (v[1]) rows.push([WPL(w), k.replace('|', ' · '), `${fmt(v[0])} / ${fmt(v[1])}`, pct(v[0], v[1])]); }); });
      table(el, [t('wp'), L('Paar', 'Pair'), L('gleich gestimmt', 'voted alike'), t('share')], rows);
    }
  };
});

part('p3', 'III. Was Gesetze regeln und wann sie gelten', 'III. What laws are about and when they apply',

  'The title of every promulgated law, the subject area DIP gives it and the day it takes effect: from them one can count treaty laws, budget laws and the transposition of EU directives, find the other parties to the treaties and draw the calendar of entry into force.');

// 10. kinds of laws

      `Five constitutions: the Weimar Constitution gave ${pct(w19.rights, w19.words)} of its text to basic rights, the Grundgesetz of 1949 ${pct(g49.rights, g49.words)}, the Imperial Constitution of 1871 none`),
    toc: L('Fünf Verfassungen', 'Five constitutions'),
    dek: L(`Die Länge der deutschen Verfassungen in Wörtern, und wie viel davon ein Grundrechtsteil ist: Weimar Art. 109–165, das Grundgesetz Art. 1–19. Die Verfassungen von 1867 und 1871 haben keinen. Das Grundgesetz ist von ${fmt(g49.words)} auf ${fmt(g.words)} Wörter gewachsen; seine Grundrechte von ${fmt(g49.rights)} auf ${fmt(g.rights)}.`,
      `The length of the German constitutions in words, and how much of it is a section on basic rights: Weimar Art. 109–165, the Grundgesetz Art. 1–19. The constitutions of 1867 and 1871 have none. The Grundgesetz has grown from ${fmt(g49.words)} to ${fmt(g.words)} words, its basic rights from ${fmt(g49.rights)} to ${fmt(g.rights)}.`),
    draw(el) {
      const cols = S8(), cards = el.append('div').attr('class', 'cards');
      rows.forEach(r => {
        const d = cards.append('div').attr('class', 'card');
        d.append('div').attr('class', 'ct').style('margin', '0 0 2px').style('font-weight', 600).style('color', 'var(--text)').text(`${L(...CONN[r.k])} · ${r.year}`);
        d.append('div').attr('class', 'cn').text(fmt(r.words));
        d.append('div').attr('class', 'ct').text(L(`Wörter · ${fmt(r.units)} ${r.k === 'pk1849' ? 'Paragraphen' : 'Artikel'}`, `words · ${fmt(r.units)} ${r.k === 'pk1849' ? 'sections' : 'articles'}`) + (r.rights ? L(` · Grundrechte ${pct(r.rights, r.words)}`, ` · basic rights ${pct(r.rights, r.words)}`) : r.rights === 0 ? L(' · keine Grundrechte', ' · no basic rights') : ''));
      });
      const w = W(el), nw = narrow(w), lw = textW(el, rows.map(r => `${L(...CONN[r.k])} ${r.year}`)) + 12, rh = 26, mx = d3.max(rows, r => r.words);
      const svg = svgIn(el, w, rows.length * rh + 8), gg = svg.append('g').attr('transform', `translate(${lw},4)`), iw = w - lw - (nw ? 44 : 70), x = d3.scaleLinear().domain([0, mx]).range([0, iw]);
      legend(el, [{ c: cols[0], l: L('Grundrechtsteil', 'basic rights') }, { c: d3.interpolateRgb(cols[0], css('--surface'))(.6), l: L('übriger Text', 'rest of the text') }, { c: css('--muted-mark'), l: L('1849: nicht getrennt (OCR)', '1849: not separated (OCR)') }]);
      rows.forEach((r, i) => {
        const cy = i * rh;
        gg.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', cy + 15).attr('text-anchor', 'end').text(`${L(...CONN[r.k])} ${r.year}`);
        if (r.rights == null) gg.append('path').attr('d', barPath(0, cy + 5, x(r.words), 14, 3)).attr('fill', css('--muted-mark'));
        else {
          gg.append('path').attr('d', barPath(0, cy + 5, x(r.words), 14, 3)).attr('fill', d3.interpolateRgb(cols[0], css('--surface'))(.6));
          if (r.rights) gg.append('path').attr('d', `M0,${cy + 5}h${x(r.rights) - 1}v14h${-(x(r.rights) - 1)}Z`).attr('fill', cols[0]);
        }
        gg.append('text').attr('class', 'lbl').attr('x', x(r.words) + 6).attr('y', cy + 16).text(fmt(r.words));
        bindTip(gg.append('rect').attr('class', 'hit').attr('x', -lw).attr('width', w).attr('y', cy).attr('height', rh).datum(r),
          d => `<b>${esc(L(...CONN[d.k]))} · ${d.year}</b>` + trow(null, L('Wörter', 'words'), fmt(d.words)) + trow(null, d.k === 'pk1849' ? L('Paragraphen', 'sections') : L('Artikel', 'articles'), fmt(d.units)) + (d.rights != null ? trow(cols[0], L('Grundrechtsteil', 'basic rights'), `${fmt(d.rights)} · ${pct(d.rights, d.words)}`) : ''));
      });
      note(el, ['historisch/verfassungen/', 'grundgesetz/artikel/', 'grundgesetz/artikel/ bei Tag gg/00'], L('6 Texte', '6 texts'),
        L('Wörter: Buchstabenfolgen im Text der Artikel, ohne Überschriften und Quellenangaben. 1849: unkorrigierte Fraktur-OCR, Seite für Seite, daher nur ungefähr; der Grundrechtsteil (§§ 130–189) lässt sich darin nicht sicher abgrenzen. Grundgesetz heute: Artikel ohne die weggefallenen.',
          'words: runs of letters in the articles\' text, without headings and source notes. 1849: uncorrected Fraktur OCR, page by page, so only approximate; its basic rights section (§§ 130–189) cannot be cut out of it reliably. Grundgesetz today: articles without the repealed ones.'));
      table(el, [L('Verfassung', 'Constitution'), t('year'), L('Artikel', 'Articles'), L('Wörter', 'Words'), L('Grundrechte (Wörter)', 'Basic rights (words)')], rows.map(r => [L(...CONN[r.k]), String(r.year), r.units, r.words, r.rights == null ? '–' : r.rights]));
    }
  };
});

const ORDER = ['p1', 'c01', 'c02', 'c03', 'c04', 'c05', 'p2', 'c06', 'c07', 'c08', 'c09', 'p3', 'c10', 'c11', 'c12', 'c13', 'c14', 'p4', 'c15', 'c16', 'c17', 'p5', 'c18', 'c19', 'c20'];
CH.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));

// ------------------------------------------------------------------ page
const TILES = () => [[fmt(PF.vorgaenge), L('Gesetzgebungsverfahren seit 1972', 'legislative procedures since 1972')], [fmt(PF.laws), L('davon verkündete Gesetze', 'of them promulgated laws')],
  [fmt(PF.acts), L('Rechtsvorschriften des Bundes', 'federal acts in force')], [fmt(PF.votes), L('namentliche Abstimmungen seit 2019', 'roll-call votes since 2019')],
  [fmt(PF.bverfg_senate), L('Senatsentscheidungen des Bundesverfassungsgerichts', 'Senate decisions of the Constitutional Court')], [fmt(PF.gemeinden), L('Gemeinden', 'municipalities')]];
function profileTable() {
  const P = PF, el = d3.select('#profile').html('');
  const rows = [
    [L('Gesetzgebungsverfahren', 'Legislative procedures'), 'bundestag/vorgaenge/', fmt(P.vorgaenge), L(`7. bis 21. Wahlperiode (1972–${YEAR_LAST})`, `7th to 21st term (1972–${YEAR_LAST})`), L('DIP; Sachgebiete erst ab der 9., Inkrafttreten nicht in der 8. bis 10. Wahlperiode; manche Verkündungsangaben nennen ein späteres Gesetzblatt (für Zeitangaben ausgelassen)', 'DIP; subject areas only from the 9th, no entry into force in the 8th to 10th term; some promulgation entries cite a later Gazette (left out of timings)')],
    [L('Namentliche Abstimmungen', 'Roll-call votes'), 'bundestag/abstimmungen/', fmt(P.votes), '2019–' + YEAR_LAST, L('nur die Ergebnisse je Fraktion werden verwendet', 'only the results per group are used')],
    [L('Bundesrecht', 'Federal law'), 'verzeichnis.json', fmt(P.acts), L('Stand 28. Oktober 2026', 'as of 28 October 2026'), L('Gesetze im Internet; ohne die Texte', 'Gesetze im Internet; without the texts')],
    [L('Änderungen des Bundesrechts', 'Changes to federal law'), 'git log global-law/pinned-20261028-6f3913a35a', fmt(P.fed_commits) + ' Commits', `${dateShort(P.fed_from)} – ${dateShort(P.fed_to)}`, L('ein Commit je Änderungsgesetz und Tag; bis Mai 2020 wöchentlich beobachtet', 'one commit per amending law and day; observed weekly until May 2020')],
    [L('Bundesverfassungsgericht', 'Constitutional Court'), 'rechtsprechung/bverfg/', fmt(P.bverfg_senate) + ' / ' + fmt(P.bverfg_all), '1998–' + YEAR_LAST, L('nur Senatsentscheidungen, nur der Tenor', 'Senate decisions only, operative part only')],
    [L('Gemeindeverzeichnis', 'Register of municipalities'), 'kommunen/gemeindeverzeichnis.csv', fmt(P.gemeinden), L('Gebietsstand 30. September 2026', 'boundaries as of 30 September 2026'), 'Destatis GV-ISys'],
    [L('Verfassungen', 'Constitutions'), 'historisch/verfassungen/ · grundgesetz/', '6', '1849–' + YEAR_LAST, L('1849 unkorrigierte OCR', '1849 uncorrected OCR')],
    [L('Nicht verwendet', 'Not used'), 'laender/ · kommunen/<ARS>/ · bundestag/reden/ · bundestag/drucksachen/ · bund/bgbl/ (bis auf Titel 2019–2023)', '–', L('Landesrecht, Ortsrecht, Reden, Drucksachen, Bundesgesetzblatt', 'Land law, local law, speeches, printed papers, the Federal Law Gazette'),
      L('unterschiedlich weit erfasst (je Land und Quelle) oder zu groß für diese Seite', 'covered unevenly (by Land and source) or too large for this page')],
  ];
  const tb = el.append('table');
  tb.append('thead').append('tr').selectAll('th').data([t('ds'), t('src'), t('n'), t('cover'), t('caveat')]).join('th').text(d => d);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').html((v, i) => i === 1 ? `<code>${esc(v)}</code>` : esc(v));
}
function checkLeftLabels(fig) {
  const fr = fig.node().getBoundingClientRect();
  fig.selectAll('svg text').each(function () {
    const r = this.getBoundingClientRect();
    if (r.width && (r.left < fr.left - 0.5 || r.right > fr.right + 0.5)) console.warn('label outside its chart', fig.attr('id'), this.textContent);
  });
}
function render() {
  HATCH = 0;
  document.documentElement.lang = LANG;
  document.title = t('title');
  d3.selectAll('[data-i]').each(function () { this.textContent = t(this.dataset.i); });
  document.getElementById('gl-link').innerHTML = t('gl');
  d3.selectAll('[data-lang]').attr('aria-pressed', function () { return String(this.dataset.lang === LANG); });
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  d3.select('#tiles').html('').selectAll('div').data(TILES()).join('div').attr('class', 'tile').html(d => `<b>${d[0]}</b><span>${esc(d[1])}</span>`);
  profileTable();
  const main = d3.select('#main').html(''), toc = d3.select('#toc').html('');
  let sec = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(L(c.de, c.en)); sec.append('p').attr('class', 'pd').text(L(c.dde, c.den));
      toc.append('a').attr('class', 'p').attr('href', '#' + c.id).text(L(c.de, c.en));
      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    let spec;
    try { spec = c.fn(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); return; }
    const h3 = fig.append('h3'); h3.append('span').attr('class', 'no').text(n + '.'); h3.append('span').text(spec.title);
    fig.append('p').attr('class', 'dek').text(spec.dek);
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    checkLeftLabels(fig);
    fig.select('svg').attr('aria-label', spec.title);
    toc.append('a').attr('href', '#' + c.id).text(`${n}. ${spec.toc || spec.title.split(/:\s/)[0]}`);
  });
  d3.select('#foot').text(t('foot').replace('{built}', dateTxt(PF.built)).replace('{head}', PF.head.slice(0, 10)));
}
d3.selectAll('[data-lang]').on('click', function () { LANG = this.dataset.lang; try { localStorage.setItem('de-viz-lang', LANG); } catch (e) {} render(); });
d3.selectAll('[data-theme-set]').on('click', function () {
  THEME = this.dataset.themeSet;
  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);
  try { localStorage.setItem('de-viz-theme', THEME); } catch (e) {}
  render();
});
if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
render();
let ft;
const redraw = () => { clearTimeout(ft); ft = setTimeout(() => { const y = scrollY; render(); scrollTo(0, y); }, 120); };
const T0 = Date.now();
if (document.fonts) { if (document.fonts.status !== 'loaded') document.fonts.ready.then(redraw); document.fonts.addEventListener('loadingdone', () => { if (Date.now() - T0 < 15000) redraw(); }); }
</script>
</body>
